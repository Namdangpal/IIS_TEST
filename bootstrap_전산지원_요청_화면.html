<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전자결재 - 전산지원</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" rel="stylesheet">

  <style>
    body { background:#eef1f5; margin:0; }

    .layout { display:flex; }

    .sidebar {
      width:260px;
      min-height:calc(100vh - 60px);
      background: linear-gradient(180deg,#0f2027,#203a43,#2c5364);
      color:#fff;
      padding-top:20px;
    }

    .menu-item {
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 20px;
      color:#cbd5e1;
      cursor:pointer;
      border-radius:8px;
      margin:4px 10px;
    }

    .menu-item:hover { background:rgba(255,255,255,0.1); color:#fff; }
    .menu-item.active { background:#ff4d4f; color:#fff; }

    .submenu { display:none; margin-left:20px; }
    .submenu a {
      display:block;
      padding:6px 10px 6px 35px;
      color:#cbd5e1;
      text-decoration:none;
      position:relative;
    }

    .submenu a::before {
      content:"-";
      position:absolute;
      left:15px;
    }

    .submenu a:hover { color:#fff; }
    

    .content {
      flex:1;
      padding:20px;
    }

    .section-box { border:1px solid #e5e7eb; border-radius:10px; padding:15px; margin-bottom:15px; background:#fff; }
    .section-header { font-weight:600; margin-bottom:10px; border-bottom:1px solid #eee; padding-bottom:5px; }

    .form-inline { display:flex; gap:15px; flex-wrap:wrap; }
    .form-item { display:flex; align-items:center; flex:1; min-width:250px; }

    .form-label-left {
      width:110px;
      background:#f3f4f6;
      padding:6px;
      border-radius:6px;
      margin-right:6px;
      font-size:13px;
    }
  </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar bg-white border-bottom px-3" style="height:60px; display:flex; align-items:center;">
  
  <!-- 좌측 로고 -->
  <div class="d-flex align-items-center">
    <img src="https://dbinsure.co.kr/common/img/header/logo.jpg" style="height:40px;">
  </div>

  <!-- 가운데 타이틀 -->
  <div style="position:absolute; left:50%; transform:translateX(-50%); font-size:20px; font-weight:600; color:#1f2937;">
    IT지원시스템
  </div>

  <!-- 우측 영역 -->
  <div class="ms-auto d-flex gap-3 align-items-center">
    
    <!-- 알림 -->
    <div class="d-flex gap-2">
      <span class="badge bg-danger">결재대기 3</span>
      <span class="badge bg-warning text-dark">검수대기 5</span>
    </div>

    <span>홍길동님</span>
    <button class="btn btn-sm btn-outline-secondary">로그아웃</button>

  </div>

</nav>

<div class="layout">

  <!-- Sidebar -->
  <div class="sidebar">

    <div class="menu-item active" onclick="toggleMenu(this)">📁 전산지원요청</div>
    <div class="submenu">
      <a href="#">장비지원</a>
      <a href="#">소모품지원</a>
      <a href="#">소프트웨어지원</a>
    </div>

    <div class="menu-item">🛠 작업요청</div>

    <div class="menu-item" onclick="toggleMenu(this)">💻 PA/GA전산요청</div>
    <div class="submenu">
      <a href="#">노트북신청(신입)</a>
      <a href="#">노트북구매</a>
    </div>

    <div class="menu-item" onclick="toggleMenu(this)">📊 전산지원진행현황</div>
    <div class="submenu">
      <a href="#">전체현황</a>
      <a href="#">결재요청</a>
      <a href="#">진행</a>
      <a href="#">검수</a>
      <a href="#">불가</a>
    </div>

    <div class="menu-item" onclick="toggleMenu(this)">📦 자산현황관리</div>
    <div class="submenu">
      <a href="#">자산현황</a>
    </div>

  </div>

  <!-- Content -->
  <div class="content">

    <!-- 기본정보 -->
    <div class="section-box">
      <div class="section-header">기본정보</div>
      <div class="form-inline">
        <div class="form-item">
          <div class="form-label-left">제목</div>
          <input class="form-control">
        </div>
        <div class="form-item">
          <div class="form-label-left">요청일</div>
          <input class="form-control">
        </div>
        <div class="form-item">
          <div class="form-label-left">우선순위</div>
          <select class="form-select">
            <option>일반</option>
            <option>긴급</option>
            <option>최우선</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 사용자정보 -->
    <div class="section-box">
      <div class="section-header">사용자정보</div>
      <div class="form-inline">
        <div class="form-item">
          <div class="form-label-left">사용자</div>
          <input class="form-control">
        </div>
        <div class="form-item">
          <div class="form-label-left">부서</div>
          <input class="form-control">
        </div>
        <div class="form-item">
          <div class="form-label-left">연락처</div>
          <input class="form-control">
        </div>
      </div>
    </div>

    <!-- 품목정보 -->
    <div class="section-box">
      <div class="section-header">품목정보</div>
      <table class="table" id="itemTable">
        <thead>
          <tr>
            <th>품목</th>
            <th>수량</th>
            <th>비고</th>
            <th style="width:80px; text-align:right;">
              <button class="btn btn-sm btn-primary" onclick="addItem()">+</button>
            </th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- 첨부파일 -->
    <div class="section-box">
      <div class="section-header">첨부파일</div>
      <input type="file" id="fileInput" class="form-control" multiple>
      <div id="fileList" class="mt-2"></div>
    </div>

    <!-- 요청정보 -->
    <div class="section-box">
      <div class="section-header">요청정보</div>
      <div class="form-inline">
        <div class="form-item">
          <div class="form-label-left">요청구분</div>
          <div>
            <input type="radio" name="type"> 신규
            <input type="radio" name="type"> 교체
            <input type="radio" name="type"> 수리
          </div>
        </div>
        <div class="form-item">
          <div class="form-label-left">설치희망일</div>
          <input class="form-control" id="datePicker">
        </div>
      </div>
      <div class="form-item mt-2">
        <div class="form-label-left">요청사유</div>
        <textarea class="form-control" rows="3"></textarea>
      </div>
    </div>

    <div class="text-end">
      <button class="btn btn-primary">결재요청</button>
      <button class="btn btn-secondary">임시저장</button>
    </div>

  </div>

</div>
    </div>

  </div>

</div>

<script>
function toggleMenu(el){
  const next = el.nextElementSibling;
  if(next && next.classList.contains('submenu')){
    next.style.display = next.style.display === 'block' ? 'none' : 'block';
  }
}

// 메뉴 active 처리

document.querySelectorAll('.menu-item, .submenu a').forEach(item=>{
  item.addEventListener('click',function(e){
    
    // 링크 클릭 시 상위 메뉴도 유지
    document.querySelectorAll('.menu-item, .submenu a').forEach(i=>i.classList.remove('active'));

    this.classList.add('active');

    // 부모 메뉴도 활성화
    const parentMenu = this.closest('.submenu');
    if(parentMenu){
      const main = parentMenu.previousElementSibling;
      if(main) main.classList.add('active');
    }
  });
});
</script>

</body>
</html>
